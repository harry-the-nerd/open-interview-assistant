<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #16171b;
        color: #e8e8ea;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      p {
        margin: 0 0 10px;
        color: #a0a0a8;
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 7px;
        margin-bottom: 6px;
        border: 1px solid #3a3a42;
        border-radius: 6px;
        background: #24252b;
        color: #e8e8ea;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #2e2f36;
      }
      #status {
        margin-top: 4px;
        font-size: 12px;
      }
      .ok {
        color: #4ade80;
      }
      .bad {
        color: #f87171;
      }
      kbd {
        padding: 1px 5px;
        border-radius: 4px;
        background: #2e2f36;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>test-extension</h1>
    <p id="hint">Checking shortcut…</p>
    <button id="shortcut" hidden>Set the keyboard shortcut</button>
    <button id="pair">Re-pair</button>
    <button id="send">Send this page now</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
